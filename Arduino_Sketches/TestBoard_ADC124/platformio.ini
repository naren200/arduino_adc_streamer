; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy@6.0.0
board = teensy41
framework = arduino
extra_scripts = pre:scripts/pre_usb_core_patch.py

[env:teensy41_profile]
extends = env:teensy41
build_flags = -DTESTBOARD_PROFILE=1

; Temporary PCB experiments. Different identity/commands/frame magic; production
; main and its wire format are excluded rather than repurposed.
[env:teensy41_pcbdiag]
extends = env:teensy41
build_flags = -DTESTBOARD_DIAGNOSTIC=1
build_src_filter = +<*> -<main.cpp>
