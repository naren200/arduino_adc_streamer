; TestBoard_7953 capacitance-test firmware (separate from production firmware).
;
; Reuses the production SpiController, Ads7953Adc, ApiProtocol and
; UsbSerialController sources read-only from ../TestBoard_7953 (never copied,
; never modified). Re-flash production with scripts/flash_production.*.

[platformio]
default_envs = teensy41_captest

[env:teensy41_captest]
platform = teensy@6.0.0
board = teensy41
framework = arduino
extra_scripts = pre:scripts/pre_captest.py
build_flags = -I../TestBoard_7953/include
build_src_filter =
    +<*>
    +<../../TestBoard_7953/src/SpiController.cpp>
    +<../../TestBoard_7953/src/Ads7953Adc.cpp>
    +<../../TestBoard_7953/src/ApiProtocol.cpp>
    +<../../TestBoard_7953/src/UsbSerialController.cpp>
