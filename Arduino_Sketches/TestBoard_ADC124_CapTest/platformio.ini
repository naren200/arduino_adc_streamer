; TestBoard_ADC124 capacitance-test firmware (separate from production firmware).
;
; Reuses the production SpiController, Adc124s101, ApiProtocol and
; UsbSerialController sources read-only from ../TestBoard_ADC124 (never copied,
; never modified). Re-flash production with scripts/flash_production.*.
;
; Deliberately has no teensy41_profile / teensy41_pcbdiag environments.

[platformio]
default_envs = teensy41_captest

[env:teensy41_captest]
platform = teensy@6.0.0
board = teensy41
framework = arduino
extra_scripts = pre:scripts/pre_captest.py
build_flags = -I../TestBoard_ADC124/include
build_src_filter =
    +<*>
    +<../../TestBoard_ADC124/src/SpiController.cpp>
    +<../../TestBoard_ADC124/src/Adc124s101.cpp>
    +<../../TestBoard_ADC124/src/ApiProtocol.cpp>
    +<../../TestBoard_ADC124/src/UsbSerialController.cpp>
